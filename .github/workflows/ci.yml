name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        node-version: [26.x]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify dist and Azure manifests are up to date
        run: git diff --exit-code dist/ azure-pipelines/
      - name: Dogfood Test Verdict Action
        uses: ./
        with:
          files: coverage/lcov.info
          config: none
          min-line: 80
          min-diff-line: 80
      - name: Dogfood test-verdict CLI
        run: node dist/cli.cjs --files coverage/lcov.info --min-line 80 --markdown
