name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify dist is up to date
        run: git diff --exit-code dist/
      - name: Dogfood test-verdict CLI
        run: node dist/cli.cjs --files coverage/lcov.info --min-line 80 --markdown
