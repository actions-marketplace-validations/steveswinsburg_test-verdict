name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (OIDC, no NPM_TOKEN).
      # Register this workflow filename (release.yml) as a GitHub Actions
      # trusted publisher on the npm package settings page.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify dist and Azure manifests are up to date
        run: git diff --exit-code dist/ azure-pipelines/
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "test-verdict@${version}" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "test-verdict@${version} is already on npm, skipping publish"
          else
            npm_latest="$(npm view test-verdict version 2>/dev/null || echo '0.0.0')"
            if [ "$version" != "$npm_latest" ] && [ "$(printf '%s\n%s' "$version" "$npm_latest" | sort -V | head -1)" = "$version" ]; then
              echo "Publishing test-verdict@${version} with dist-tag release-${version} (npm latest is ${npm_latest})"
              npm publish --tag "release-${version}"
            else
              npm publish
            fi
          fi
      - name: Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "${version} already exists, skipping GitHub Release"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$version" --generate-notes --target "$GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Update floating major tag
        if: steps.release.outputs.created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERSION" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            git fetch --tags --force
            HIGHEST="$(git tag -l "v${MAJOR}.*.*" | grep -E "^v${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)"
            if [ "$HIGHEST" = "$VERSION" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -fa "v${MAJOR}" -m "Update v${MAJOR} tag to ${VERSION}" "$GITHUB_SHA"
              git push origin "refs/tags/v${MAJOR}" --force
            else
              echo "Skipping floating tag v${MAJOR}: ${VERSION} is not the highest tag (${HIGHEST})"
            fi
          else
            echo "Skipping floating major tag update for non-stable tag $VERSION"
          fi
      - name: Package Azure Pipelines extension (.vsix)
        id: azure-package
        if: steps.release.outputs.created == 'true'
        run: |
          npm run package:azure
          version="$(node -p "require('./package.json').version")"
          vsix="dist/steveswinsburg.test-verdict-${version}.vsix"
          test -f "$vsix"
          echo "vsix=${vsix}" >> "$GITHUB_OUTPUT"
      - name: Attach .vsix to GitHub Release
        if: steps.release.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          VSIX: ${{ steps.azure-package.outputs.vsix }}
        run: gh release upload "$VERSION" "$VSIX" --clobber
